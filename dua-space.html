<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>مساحة الدعاء لبيان ❤️</title>

<body>
<div class="dua-bg" aria-hidden="true"></div>
<main class="dua-page">

    <div class="progress" id="progress">الدعاء ١ من ١٠</div>

    <div class="dua-text" id="duaText"></div>
    <div class="dua-heart" id="nextHeart" role="button" tabindex="0" aria-label="الدعاء التالي">❤️</div>
    <p class="hint" id="hint">اضغطي على القلب بهدوء للدعاء التالي</p>
  </section>
</main>
<script src="dua-space.js?v=1"></script>
