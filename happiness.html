<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160a18"><title>عداد سعادة بيان ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#4a173f,#160a18 60%);color:#fff;padding:22px}.wrap{max-width:720px;margin:auto}.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);border-radius:28px;padding:24px;box-shadow:0 20px 60px #0005}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:18px;opacity:.9}.title{text-align:center}.emoji{font-size:54px}.title h1{margin:5px 0;font-size:32px}.title p{opacity:.82}.meter{width:230px;height:230px;border-radius:50%;margin:28px auto 20px;background:conic-gradient(#ff72b6 var(--p),#ffffff18 0);display:grid;place-items:center;position:relative;box-shadow:0 0 45px #ff4fa744}.meter:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#241125}.value{position:relative;text-align:center}.value strong{font-size:52px}.value span{display:block;opacity:.7}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;background:#fff;color:#222;border:0;border-radius:16px;padding:15px;font-size:20px;text-align:center}.row button{border:0;border-radius:16px;padding:0 20px;background:#ff5eaa;color:#fff;font-weight:800;font-size:17px}.hint{text-align:center;opacity:.65;font-size:13px;margin:10px}.message{text-align:center;min-height:58px;margin:18px 0;font-size:18px;line-height:1.7}.trend{margin-top:24px}.trend h2{font-size:20px}.chart{height:230px;position:relative;padding:12px 8px 28px;border-bottom:1px solid #ffffff22;overflow:hidden}.chart svg{width:100%;height:100%;display:block;overflow:visible}.gridline{stroke:#ffffff14;stroke-width:1}.trendline{fill:none;stroke:#ff72b6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ff72b688)}.point{fill:#fff;stroke:#ff72b6;stroke-width:3}.axis{fill:#ffffff80;font-size:10px}.empty{text-align:center;opacity:.6;padding:65px 0}.history{margin-top:15px;display:grid;gap:8px}.item{display:flex;justify-content:space-between;background:#ffffff09;padding:11px 13px;border-radius:13px}.special{margin-top:20px;text-align:center;font-size:18px;font-weight:700}.clear{display:block;margin:18px auto 0;background:transparent;border:1px solid #ffffff33;color:#fff;border-radius:12px;padding:9px 14px}@media(max-width:500px){.meter{width:205px;height:205px}.meter:before{width:168px;height:168px}.row button{padding:0 14px}}</style></head><body><main class="wrap"><a class="back" href="index.html">↩️ رجوع للموقع</a><section class="card"><div class="title"><div class="emoji">💗</div><h1>عداد سعادة بيان</h1><p>بيان، قديش مبسوطة اليوم؟ اختاري رقمًا من 100 ❤️</p></div><div class="meter" id="meter" style="--p:0%"><div class="value"><strong id="num">0</strong><span>من 100</span></div></div><div class="row"><input id="score" type="number" min="0" max="100" inputmode="numeric" placeholder="مثلاً 87"><button id="save">💗 سجّلي السعادة</button></div><div class="hint">كل قراءة بتنحفظ على هذا الجهاز، وبنرسمها تحت العداد 📈</div><div class="message" id="message">مستنيين أول قراءة من بيان ✨</div><div class="trend"><h2>📈 Trend سعادة بيان</h2><div id="chart" class="chart"></div><div id="history" class="history"></div></div><div class="special" id="special"></div><button class="clear" id="clear">مسح القراءات</button></section></main><script>const KEY='bayan_happiness_v1';const phrases=["100؟ شكله اليوم السعادة قررت تسكن بقلب بيان. ❤️","واضح إن بيان اليوم خطيرة من كثر السعادة 😂❤️","إذا هاي 100، لازم نخترع رقم جديد اسمه «بيان».","100/100… اليوم ممنوع على الحزن حتى يمر من جنبك. ❤️","واضح إن الضحكة اليوم أخذت دوام كامل 😂","هاي مش قراءة سعادة، هاي شهادة إن اليوم كان حلو جدًا. ✨","السعادة اليوم وصلت القمة وقالت: هون بيت بيان.","لو كل الأيام هيك، بنلغي كلمة «يوم سيئ» من القاموس 😂","100/100… العداد أعلن استسلامه 😂❤️","95؟ الخمسة الباقية مخبيتها عشان تخلّي العداد يشتاقلك 😂❤️","92؟ ممتاز… بس العداد طمّاع، بده يشوفك 100.","88؟ يعني في مجال صغير نرفع المعنويات شوي 😌❤️","70؟ حاسس في 30 نقطة مستنيين ضحكتك. 😂","50؟ نص السعادة موجودة، والنص الثاني أكيد ضايع عند الضحكة 😂","10؟ واضح إن السعادة اليوم بدها صيانة بسيطة. 🔧❤️","0؟ مستحيل… أكيد العداد خربان، نعيد الفحص فورًا 😂","كل رقم بتحطيه اليوم هو ذكرى صغيرة بتظل محفوظة. ❤️","كل نقطة على الرسم إلها يوم، وكل يوم إله حكاية. ❤️","خلّي الأيام ترسم لنا أجمل Trend ممكن. 📈❤️","العداد: «أنا مجرد آلة، ليش عم بتوتروني؟» 😂","تم تسجيل القراءة… والعداد حاليًا يحاول يستوعب 😂","النظام يعمل طبيعيًا، لكن كمية السعادة غير طبيعية 😂","تحذير: مستوى السعادة بدأ يسبب غيرة للعداد نفسه. 😂","إذا كانت 100، فالعداد بحاجة إلى ترقية عاجلة. 🚀❤️","وصلنا 100! العداد طلب إجازة من شدة الضغط 😂","100… وتم تسجيل الحالة تحت بند: «بيان مبسوطة جدًا». ❤️","العداد وصل آخره، أما السعادة شكلها لسه عندها كلام.","100! رسميًا اليوم لا يحتاج تحسينات. ✨","تم بلوغ الحد الأقصى… والابتسامة ما زالت مستمرة 😂","100/100… حتى الرسم البياني وقف احترامًا 😂","أجمل شيء في هذا العداد إنه يتغير، مثل الأيام تمامًا.","لو كانت السعادة مادة مدرسية، بيان اليوم جابت العلامة الكاملة 😂","تم اعتماد اليوم رسميًا كيوم ممتاز. ختم الإدارة: ❤️","وزارة السعادة تعلن: بيان تجاوزت الحد الطبيعي من اللطافة 😂","التقرير الرسمي: المزاج ممتاز، والضحكة تحت السيطرة… تقريبًا 😂","كل قراءة منك بتخلي الرسم البياني يحكي عن يوم من أيامك. ❤️","خلّي الرسم البياني يطلع لفوق… مش استعجال، بس بنحب المنظر 😂","الهدف مش إن كل الأيام تكون 100، الهدف إن يكون فيها شيء يستاهل الابتسام.","إذا كانت السعادة أقل من 100، العداد يقترح جرعة ضحك إضافية 😂","العداد عنده اقتراح: ابتسامة صغيرة ونعيد القياس بعد شوي. ❤️","حتى لو نزل الـTrend، بكرة ممكن يرجع يطلع. 📈❤️","كل نزلة إلها طلعة، وكل يوم إله فرصة جديدة.","إذا ما عجبك الرقم، خلي بكرة يحاول يصلحه 😂","العداد يقول: لا ضغط، بس ابتسامة لو سمحتي 😂❤️","100/100 ❤️ — بيان اليوم أعلنت رسميًا أن السعادة بخير.","100/100 😂❤️ — العداد دخل مرحلة «أنا شو بدي أعمل أكثر من هيك؟»","100/100 — تم إغلاق باب الحزن مؤقتًا حتى إشعار آخر.","100/100 — الرقم كامل، والابتسامة أجمل من الرقم. ❤️","100/100 — اليوم أخذ العلامة الكاملة، وبيان أخذت كل السعادة.","100/100 — العداد وصل نهايته، بس اليوم لسه حلو. ✨","100/100 — النظام يقترح الاحتفال بهذه القراءة 😂🎉","100/100 — تم تسجيل أعلى مستوى للسعادة بنجاح. ❤️","100/100 — لا توجد أرقام أعلى… يبدو أننا وصلنا للقمة. 👑❤️","100/100 — العداد يقول «كفاية»… والقلب يقول «خليها مبسوطة أكثر». ❤️"];let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}const $=id=>document.getElementById(id);function phrase(v){if(v===100)return phrases[45+Math.floor(Math.random()*10)];if(v>=90)return phrases[Math.floor(Math.random()*8)];if(v>=70)return phrases[10+Math.floor(Math.random()*8)];if(v>=40)return phrases[20+Math.floor(Math.random()*14)];return phrases[32+Math.floor(Math.random()*13)]}function render(v=null,msg=null){let latest=v??(data.at(-1)?.v??0);$('num').textContent=latest;$('meter').style.setProperty('--p',latest+'%');if(msg)$('message').textContent=msg;let c=$('chart');if(!data.length){c.innerHTML='<div class="empty">لسه ما في قراءات — أول نقطة إلها طعم خاص ❤️</div>}else{let w=Math.max(560,data.length*62),h=180,pad=18,pts=data.map((x,i)=>({x:pad+(data.length===1?w/2:i*(w-pad*2)/(data.length-1)),y:h-pad-(x.v/100)*(h-pad*2),v:x.v}));let poly=pts.map(p=>p.x+','+p.y).join(' ');let dots=pts.map(p=>'<circle class="point" cx="'+p.x+'" cy="'+p.y+'" r="5"><title>'+p.v+'/100</title></circle>').join('');let labels=pts.map((p,i)=>i%Math.ceil(data.length/8)===0?'<text class="axis" x="'+p.x+'" y="'+(h-2)+'" text-anchor="middle">'+new Date(data[i].t).toLocaleDateString('ar-JO',{day:'2-digit',month:'2-digit'})+'</text>':'').join('');c.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line class="gridline" x1="0" y1="18" x2="'+w+'" y2="18"/><line class="gridline" x1="0" y1="90" x2="'+w+'" y2="90"/><line class="gridline" x1="0" y1="162" x2="'+w+'" y2="162"/><polyline class="trendline" points="'+poly+'"/>'+dots+labels+'</svg>'}$('history').innerHTML=data.slice().reverse().map(x=>'<div class="item"><span>'+new Date(x.t).toLocaleString('ar-JO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span><b>'+x.v+'/100</b></div>').join('');$('special').textContent=latest===100?'✨ اليوم وصلنا 100/100… وهذه القراءة تستحق الاحتفال 😂❤️':''}function save(){let v=Number($('score').value);if(!Number.isFinite(v)||v<0||v>100){$('message').textContent='اختاري رقمًا بين 0 و100 ❤️';return}data.push({v,t:Date.now()});localStorage.setItem(KEY,JSON.stringify(data));$('score').value='';render(v,phrase(v))}function clearAll(){if(confirm('متأكدة إنك بدك تمسحي كل القراءات؟')){data=[];localStorage.removeItem(KEY);render(0,'تمت البداية من جديد… مستنيين أول قراءة ❤️')}}$('save').onclick=save;$('score').addEventListener('keydown',e=>{if(e.key==='Enter')save()});$('clear').onclick=clearAll;render();</script></body></html>
