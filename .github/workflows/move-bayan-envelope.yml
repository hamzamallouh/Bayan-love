name: Move Bayan envelope
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Move Bayan envelope right'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move only Bayan envelope right
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.envelopeWrap{width:min(680px,92vw);margin:20px auto}'
          new='.envelopeWrap{width:min(680px,92vw);margin:20px auto;transform:translateX(14px)}'
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move Bayan envelope right'
          git push
