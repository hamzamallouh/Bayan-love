<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#160a18"><title>عداد سعادة بيان ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#4a173f,#160a18 60%);color:#fff;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(16px);border-radius:28px;padding:24px;box-shadow:0 20px 60px #0005}.back{color:#fff;text-decoration:none}.title{text-align:center}.emoji{font-size:52px}.title h1{margin:4px 0;font-size:32px}.title p{opacity:.85}.meter{width:230px;height:230px;border-radius:50%;margin:25px auto;background:conic-gradient(#ff72b6 var(--p),#ffffff18 0);display:grid;place-items:center;position:relative;box-shadow:0 0 45px #ff4fa744}.meter:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#241125}.value{position:relative;text-align:center}.value strong{font-size:52px}.value span{display:block;opacity:.7}.row{display:flex;gap:10px}.row input{flex:1;background:#fff;color:#222;border:0;border-radius:16px;padding:15px;font-size:20px;text-align:center}.row button{border:0;border-radius:16px;padding:0 18px;background:#ff5eaa;color:#fff;font-weight:800;font-size:16px;cursor:pointer}.message{text-align:center;min-height:58px;margin:18px 0;font-size:18px;line-height:1.7}.trend{margin-top:25px}.chart{height:240px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid #ffffff22}.chart svg{height:220px;min-width:100%;display:block}.grid{stroke:#ffffff16}.line{fill:none;stroke:#ff72b6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:#fff;stroke:#ff72b6;stroke-width:3}.axis{fill:#ffffff88;font-size:10px}.empty{text-align:center;opacity:.6;padding:70px 0}.history{display:grid;gap:8px;margin-top:14px}.item{display:flex;justify-content:space-between;background:#ffffff09;padding:11px 13px;border-radius:13px}.special{text-align:center;margin-top:18px;font-size:18px;font-weight:700}.clear{display:block;margin:18px auto 0;background:transparent;border:1px solid #ffffff33;color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer}@media(max-width:500px){.meter{width:205px;height:205px}.meter:before{width:168px;height:168px}.row button{padding:0 12px}}</style></head><body><main class="wrap"><a class="back" href="index.html">↩️ رجوع للموقع</a><section class="card"><div class="title"><div class="emoji">💗</div><h1>عداد سعادة بيان</h1><p>بيان، قديش مبسوطة اليوم؟ دخّلي رقمك من 0 إلى 100 ❤️</p></div><div class="meter" id="meter" style="--p:0%"><div class="value"><strong id="num">0</strong><span>من 100</span></div></div><div class="row"><input id="score" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="مثلاً 87"><button type="button" id="save">💗 سجّلي القراءة</button></div><div class="message" id="message">مستنيين أول قراءة من بيان ✨</div><div class="trend"><h2>📈 Trend سعادة بيان</h2><div id="chart" class="chart"></div><div id="history" class="history"></div></div><div class="special" id="special"></div><button type="button" class="clear" id="clear">مسح القراءات</button></section></main><script>const KEY='bayan_happiness_v1';let data=[];try{const saved=localStorage.getItem(KEY);data=saved?JSON.parse(saved):[]}catch(e){data=[]}if(!Array.isArray(data))data=[];const phrases={high:['واضح إن اليوم السعادة قررت تسكن عند بيان 😂❤️','هاي مش قراءة سعادة… هاي شهادة إن اليوم حلو جدًا ✨','العداد وصل القمة وقال: هون بيت بيان ❤️','إذا هاي 100، لازم نخترع رقم جديد اسمه «بيان» 😂❤️','اليوم أخذ العلامة الكاملة… والابتسامة أجمل من الرقم ❤️'],mid:['واضح إن الضحكة اليوم إلها دور كبير 😂❤️','قراءة حلوة… بس العداد طمّاع بده يشوفها أعلى 😌❤️','كل نقطة هون ذكرى صغيرة من يومك ❤️','في مجال بسيط لضحكة ترفع الرقم شوي 😂','الهدف مش الكمال… المهم يكون في شيء يستاهل الابتسام ❤️'],low:['واضح إن اليوم بده جرعة ضحك إضافية 😂❤️','حتى لو الرقم نازل، بكرة ممكن يطلع 📈❤️','العداد يقترح ابتسامة صغيرة ونعيد القياس بعد شوي ❤️','كل يوم إله فرصة جديدة… وهذا اليوم مش استثناء 🌷','الرقم مجرد قراءة، والأيام بتتغير ❤️']};function pick(a){return a[Math.floor(Math.random()*a.length)]}function phrase(v){if(v===100)return pick(['100/100 😂❤️ — العداد أعلن استسلامه من شدة السعادة!','100/100 — تم إغلاق باب الحزن مؤقتًا 😂❤️','100/100 — الرقم كامل، والابتسامة أجمل من الرقم ❤️','100/100 — لا توجد أرقام أعلى… وصلنا للقمة 👑❤️','100/100 — العداد يقول «كفاية»… والقلب يقول «خليها مبسوطة أكثر» ❤️']);if(v>=80)return pick(phrases.high);if(v>=40)return pick(phrases.mid);return pick(phrases.low)}function render(latest){if(latest===undefined)latest=data.length?data[data.length-1].v:0;document.getElementById('num').textContent=latest;document.getElementById('meter').style.setProperty('--p',latest+'%');const chart=document.getElementById('chart');if(!data.length){chart.innerHTML='<div class="empty">لسه ما في قراءات — أول نقطة إلها طعم خاص ❤️</div>'}else{const w=Math.max(560,data.length*70),h=200,p=20;const pts=data.map((d,i)=>({x:data.length===1?w/2:p+i*(w-2*p)/(data.length-1),y:h-p-(d.v/100)*(h-2*p),v:d.v,t:d.t}));const poly=pts.map(x=>x.x+','+x.y).join(' ');const dots=pts.map(x=>'<circle class="point" cx="'+x.x+'" cy="'+x.y+'" r="5"><title>'+x.v+'/100</title></circle>').join('');const labels=pts.map((x,i)=>i%Math.max(1,Math.ceil(data.length/8))===0?'<text class="axis" x="'+x.x+'" y="'+(h-2)+'" text-anchor="middle">'+new Date(x.t).toLocaleDateString('ar-JO',{day:'2-digit',month:'2-digit'})+'</text>':'').join('');chart.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line class="grid" x1="0" y1="20" x2="'+w+'" y2="20"/><line class="grid" x1="0" y1="100" x2="'+w+'" y2="100"/><line class="grid" x1="0" y1="180" x2="'+w+'" y2="180"/><polyline class="line" points="'+poly+'"/>'+dots+labels+'</svg>'}document.getElementById('history').innerHTML=data.slice().reverse().map(d=>'<div class="item"><span>'+new Date(d.t).toLocaleString('ar-JO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span><b>'+d.v+'/100</b></div>').join('');document.getElementById('special').textContent=latest===100?'✨ 100/100… هذه القراءة تستحق الاحتفال 😂❤️':''}function save(){const input=document.getElementById('score');const v=Number(input.value);if(!Number.isFinite(v)||v<0||v>100||input.value===''){document.getElementById('message').textContent='اكتبي رقمًا صحيحًا بين 0 و100 ❤️';input.focus();return}const reading={v:Math.round(v),t:Date.now()};data.push(reading);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}document.getElementById('message').textContent=phrase(reading.v);input.value='';render(reading.v)}function clearAll(){if(confirm('متأكدة إنك بدك تمسحي كل القراءات؟')){data=[];try{localStorage.removeItem(KEY)}catch(e){}document.getElementById('message').textContent='تمت البداية من جديد… مستنيين أول قراءة ❤️';render(0)}}document.getElementById('save').addEventListener('click',save);document.getElementById('score').addEventListener('keydown',e=>{if(e.key==='Enter')save()});document.getElementById('clear').addEventListener('click',clearAll);render();</script></body></html>
