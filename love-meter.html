<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160a18"><title>عداد الحب ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#6d205d,#260d28 44%,#100811 100%);overflow:hidden}.wrap{width:min(720px,100%);min-height:100vh;margin:auto;padding:18px;display:flex;align-items:center;justify-content:center}.card{width:100%;padding:22px 18px 30px;border:1px solid rgba(255,255,255,.13);border-radius:32px;background:rgba(22,10,24,.76);backdrop-filter:blur(20px);box-shadow:0 25px 90px rgba(0,0,0,.42);text-align:center}.back{display:block;text-align:right;color:#e8bfdc;text-decoration:none;font-size:13px;margin-bottom:5px}.heart{font-size:48px;animation:pulse 1.5s infinite}.title{font-size:29px;margin:2px 0 6px}.sub{color:#d7b9d0;font-size:14px;line-height:1.8;margin:0 auto 14px}.field{display:flex;gap:9px;max-width:430px;margin:auto}.field input{flex:1;min-width:0;padding:14px;border-radius:16px;border:1px solid #704566;background:#170d18;color:#fff;font-size:17px;text-align:center;outline:none}.go{padding:14px 19px;border:0;border-radius:16px;background:#fff;color:#2a1027;font-weight:800;font-size:15px;cursor:pointer}.dial{position:relative;width:min(340px,78vw);height:min(340px,78vw);margin:20px auto 8px;border-radius:50%;background:radial-gradient(circle,#291129 0 48%,#170b17 49% 100%);border:10px solid #4a2144;box-shadow:inset 0 0 25px #000,0 0 25px rgba(255,100,180,.18)}.dial::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px dashed rgba(255,255,255,.16)}.ticks{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -135deg,rgba(255,255,255,.8) 0deg 1deg,transparent 1deg 7.2deg);mask:radial-gradient(circle,transparent 0 72%,#000 73%)}.arc{position:absolute;inset:18px;border-radius:50%;background:conic-gradient(from 225deg,#ff78b8 0deg,#ffb3da var(--deg,0deg),transparent var(--deg,0deg) 270deg,rgba(255,255,255,.06) 270deg);mask:radial-gradient(circle,transparent 0 82%,#000 83%)}.needle{position:absolute;left:50%;bottom:50%;width:5px;height:40%;transform-origin:50% 100%;transform:translateX(-50%) rotate(-135deg);background:#fff;border-radius:8px;box-shadow:0 0 14px #ff9aca;transition:transform .15s}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#241024;border:3px solid #ff9aca;box-shadow:0 0 28px rgba(255,120,190,.5);font-size:31px}.readout{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:39px;font-weight:950;white-space:nowrap;text-shadow:0 0 15px rgba(255,150,210,.45)}.label{position:absolute;left:50%;top:77%;transform:translateX(-50%);font-size:11px;color:#cdb3c7}.dial.overload{animation:shake .07s infinite;box-shadow:inset 0 0 35px #000,0 0 35px #ff5cb4,0 0 80px rgba(255,70,170,.45);border-color:#ff4aa9}.dial.broken{animation:break .45s forwards}.hint{font-size:12px;color:#bda4b7;min-height:22px}.burst{position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;z-index:10}.burst.show{display:flex}.smoke,.spark,.fragment{position:absolute}.smoke{font-size:48px;animation:smoke 1.5s ease-out forwards}.spark{font-size:36px;animation:spark .9s ease-out forwards}.fragment{font-size:30px;animation:frag .8s ease-out forwards}.result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,5,11,.86);z-index:20}.result.show{display:flex}.popup{width:min(520px,100%);padding:34px 24px;border-radius:30px;background:linear-gradient(145deg,#3b1535,#170b18);border:1px solid rgba(255,255,255,.15);box-shadow:0 25px 90px #000;text-align:center}.popup .emoji{font-size:65px}.popup h2{font-size:27px;line-height:1.5;margin:12px 0}.popup p{color:#d9bfd4;line-height:1.8}.again{border:0;border-radius:14px;padding:13px 24px;background:#fff;color:#271024;font-weight:800;cursor:pointer}@keyframes pulse{50%{transform:scale(1.1)}}@keyframes shake{0%{transform:translate(0)}25%{transform:translate(2px,-1px) rotate(.5deg)}50%{transform:translate(-2px,1px) rotate(-.5deg)}75%{transform:translate(1px,2px)}100%{transform:translate(0)}}@keyframes break{0%{transform:scale(1)}50%{transform:scale(1.06) rotate(1deg)}100%{transform:scale(.82) rotate(-5deg);opacity:.25;filter:blur(2px)}}@keyframes smoke{0%{transform:translate(0,20px) scale(.3);opacity:0}25%{opacity:1}100%{transform:translate(var(--x),-180px) scale(2);opacity:0}}@keyframes spark{0%{transform:translate(0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(540deg) scale(1.3);opacity:0}}@keyframes frag{0%{transform:translate(0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(400deg);opacity:0}}@media(max-width:430px){.field{flex-direction:column}.go{width:100%}.title{font-size:25px}.dial{margin-top:15px}}</style></head><body><div class="wrap"><main class="card"><a class="back" href="index.html">⌂ الرئيسية</a><div class="heart">❤️</div><h1 class="title">عداد حب حمزة لبيان</h1><p class="sub">كم بتتوقعي نسبة حب حمزة لبيان؟<br>اكتبي النسبة وخلي العداد يحاول يحسب المستحيل ❤️</p><div class="field"><input id="guess" type="number" min="0" inputmode="numeric" placeholder="مثلاً 1000"><button class="go" onclick="start()">احسب ❤️</button></div><div class="dial" id="dial"><div class="ticks"></div><div class="arc" id="arc"></div><div class="needle" id="needle"></div><div class="hub">❤️</div><div class="readout" id="readout">0%</div><div class="label">LOVE CAPACITY</div></div><div class="hint" id="hint">العداد جاهز... ❤️</div></main></div><div class="burst" id="burst"></div><div class="result" id="result"><div class="popup"><div class="emoji">💥❤️</div><h2>ما قدرنا نحسب حب حمزة لبيان...</h2><p>حب حمزة لبيان تجاوز قدرة العداد على القياس.<br><b>لأن حب حمزة لبيان ما إلو حد ❤️</b></p><button class="again" onclick="again()">نجرب مرة ثانية ❤️</button></div></div><script>let timer;function start(){const input=document.getElementById('guess');const target=Number(input.value);if(!Number.isFinite(target)||target<0){input.focus();return}clearInterval(timer);const dial=document.getElementById('dial');dial.classList.remove('overload','broken');document.getElementById('hint').textContent='جاري قياس الحب... ❤️';let v=0;timer=setInterval(()=>{const step=Math.max(1,Math.ceil((target-v)/13));v+=step;if(v>=target){v=target;clearInterval(timer);setTimeout(()=>overload(target),350)}render(v,target)},38)}function render(v,target){document.getElementById('readout').textContent=Math.round(v)+'%';const ratio=target?Math.min(v/Math.max(target,100),1):0;document.getElementById('arc').style.setProperty('--deg',(ratio*270)+'deg');document.getElementById('needle').style.transform='translateX(-50%) rotate('+(-135+ratio*270)+'deg)'}function overload(target){const dial=document.getElementById('dial');dial.classList.add('overload');document.getElementById('hint').textContent='⚠️ تحذير: الحب تجاوز قدرة العداد!';let v=Math.max(target,100),i=0;const t=setInterval(()=>{v+=Math.max(1,Math.ceil(v*.16));render(v,Math.max(target,v));i++;if(i>=10){clearInterval(t);explode()}},100)}function explode(){const dial=document.getElementById('dial');dial.classList.add('broken');const burst=document.getElementById('burst');burst.innerHTML='';for(let i=0;i<9;i++){const s=document.createElement('span');s.className='smoke';s.textContent='💨';s.style.setProperty('--x',(Math.random()*280-140)+'px');s.style.left=(43+Math.random()*14)+'%';s.style.top=(38+Math.random()*15)+'%';burst.appendChild(s)}for(let i=0;i<18;i++){const s=document.createElement('span');s.className=i%2?'spark':'fragment';s.textContent=i%2?'⚡':'💥';s.style.setProperty('--x',(Math.random()*480-240)+'px');s.style.setProperty('--y',(Math.random()*340-170)+'px');s.style.left='50%';s.style.top='45%';burst.appendChild(s)}burst.classList.add('show');setTimeout(()=>{burst.classList.remove('show');document.getElementById('result').classList.add('show')},1300)}function again(){document.getElementById('result').classList.remove('show');document.getElementById('dial').classList.remove('overload','broken');document.getElementById('readout').textContent='0%';document.getElementById('arc').style.setProperty('--deg','0deg');document.getElementById('needle').style.transform='translateX(-50%) rotate(-135deg)';document.getElementById('hint').textContent='العداد جاهز... ❤️';document.getElementById('guess').value=''}</script></body></html>
