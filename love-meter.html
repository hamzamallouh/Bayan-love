<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#160a18"><title>عداد الحب ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#5b1d50 0,#260d28 42%,#100811 100%);overflow-x:hidden}.wrap{width:min(680px,100%);min-height:100vh;margin:auto;padding:22px 18px 40px;display:flex;align-items:center;justify-content:center}.card{width:100%;padding:28px 20px 34px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(22,10,24,.72);backdrop-filter:blur(18px);box-shadow:0 25px 80px rgba(0,0,0,.35);text-align:center}.back{display:block;text-align:right;color:#e8bfdc;text-decoration:none;font-size:13px;margin-bottom:16px}.heart{font-size:62px;animation:pulse 1.5s infinite}.title{font-size:30px;margin:5px 0 8px}.sub{color:#d7b9d0;font-size:14px;line-height:1.8;margin:0 auto 24px;max-width:500px}.field{display:flex;gap:10px;max-width:430px;margin:auto}.field input{flex:1;min-width:0;padding:15px;border-radius:16px;border:1px solid #704566;background:#170d18;color:#fff;font-size:17px;text-align:center;outline:none}.go{padding:15px 20px;border:0;border-radius:16px;background:#fff;color:#2a1027;font-weight:800;font-size:15px;cursor:pointer}.meter{position:relative;margin:30px auto 16px;width:min(390px,90vw);height:30px;padding:4px;border-radius:30px;background:#160b17;border:1px solid #704566;overflow:visible}.fill{height:100%;width:0;border-radius:25px;background:linear-gradient(90deg,#ff78b8,#ffb3da);transition:width .18s;box-shadow:0 0 22px rgba(255,115,181,.55)}.meter.overload{animation:shake .08s infinite;box-shadow:0 0 25px #ff78b8,0 0 60px rgba(255,80,170,.4)}.percent{font-size:42px;font-weight:900;min-height:52px}.hint{font-size:12px;color:#bda4b7;min-height:22px}.burst{position:fixed;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;z-index:10}.burst.show{display:flex}.bigheart{font-size:110px;animation:boom .9s forwards}.smoke{position:absolute;font-size:45px;animation:smoke 1.2s ease-out forwards}.spark{position:absolute;font-size:34px;animation:spark .8s ease-out forwards}.result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,5,11,.84);z-index:20}.result.show{display:flex}.popup{width:min(520px,100%);padding:34px 24px;border-radius:30px;background:linear-gradient(145deg,#3b1535,#170b18);border:1px solid rgba(255,255,255,.15);box-shadow:0 25px 90px #000;text-align:center}.popup .emoji{font-size:65px}.popup h2{font-size:27px;line-height:1.5;margin:12px 0}.popup p{color:#d9bfd4;line-height:1.8}.again{border:0;border-radius:14px;padding:13px 24px;background:#fff;color:#271024;font-weight:800;cursor:pointer}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes boom{0%{transform:scale(1);opacity:1}45%{transform:scale(1.25);opacity:1}55%{transform:scale(.9);opacity:1}70%{transform:scale(2.1);opacity:1}100%{transform:scale(3.2);opacity:0}}@keyframes smoke{0%{transform:translate(0,10px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(var(--x),-150px) scale(1.8);opacity:0}}@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(500deg) scale(1.2);opacity:0}}@keyframes shake{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(2px) rotate(.7deg)}50%{transform:translateX(-2px) rotate(-.7deg)}75%{transform:translateX(2px) rotate(.5deg)}100%{transform:translateX(0) rotate(0)}}@media(max-width:430px){.field{flex-direction:column}.go{width:100%}.title{font-size:26px}}</style></head><body><div class="wrap"><main class="card"><a class="back" href="index.html">⌂ الرئيسية</a><div class="heart">❤️</div><h1 class="title">عداد حب حمزة لبيان</h1><p class="sub">كم بتتوقعي نسبة حب حمزة لبيان؟<br>اكتبي النسبة واضغطي <b>احسب ❤️</b> وشوفي شو بصير...</p><div class="field"><input id="guess" type="number" min="0" inputmode="numeric" placeholder="مثلاً 100"><button class="go" onclick="start()">احسب ❤️</button></div><div class="meter" id="meter"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0%</div><div class="hint" id="hint">العداد جاهز... ❤️</div></main></div><div class="burst" id="burst"><div class="bigheart">❤️</div></div><div class="result" id="result"><div class="popup"><div class="emoji">💥❤️</div><h2>ما قدرنا نحسب حب حمزة لبيان...</h2><p>لأن حب حمزة لبيان ما إلو حد ❤️<br>العداد وصل للفل... وكمّل وكمّل... وبالأخير فقع! 😂❤️</p><button class="again" onclick="again()">نجرب نحسبه مرة ثانية</button></div></div><script>let timer;function start(){const input=document.getElementById('guess');let n=Number(input.value);if(!Number.isFinite(n)||n<0){input.focus();return}clearInterval(timer);let v=0;document.getElementById('hint').textContent='جاري قياس الحب... استني شوي ❤️';timer=setInterval(()=>{const step=Math.max(1,Math.ceil((n-v)/10));v+=step;if(v>=n){v=n;clearInterval(timer);setTimeout(()=>overload(n),350)}document.getElementById('percent').textContent=v+'%';document.getElementById('fill').style.width=Math.min((v/Math.max(n,100))*100,100)+'%';},45)}function overload(target){document.getElementById('hint').textContent='استنى... الحب لسه بزيد! 😳❤️';const meter=document.getElementById('meter');meter.classList.add('overload');let v=Math.max(target,100),i=0;const t=setInterval(()=>{v+=Math.max(1,Math.ceil(v*.12));document.getElementById('percent').textContent=v+'%';document.getElementById('fill').style.width='100%';i++;if(i>9){clearInterval(t);explode()}},90)}function explode(){const burst=document.getElementById('burst');burst.innerHTML='<div class="bigheart">❤️</div>';for(let i=0;i<7;i++){const s=document.createElement('span');s.className='smoke';s.textContent='💨';s.style.setProperty('--x',(Math.random()*220-110)+'px');s.style.left=(45+Math.random()*10)+'%';s.style.top=(42+Math.random()*10)+'%';burst.appendChild(s)}for(let i=0;i<14;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'⚡':'✨';s.style.setProperty('--x',(Math.random()*360-180)+'px');s.style.setProperty('--y',(Math.random()*260-130)+'px');s.style.left='50%';s.style.top='45%';burst.appendChild(s)}burst.classList.add('show');setTimeout(()=>{burst.classList.remove('show');document.getElementById('meter').classList.remove('overload');document.getElementById('result').classList.add('show')},1000)}function again(){document.getElementById('result').classList.remove('show');document.getElementById('percent').textContent='0%';document.getElementById('fill').style.width='0%';document.getElementById('hint').textContent='العداد جاهز... ❤️';document.getElementById('guess').value='';document.getElementById('meter').classList.remove('overload')}</script></body></html>
